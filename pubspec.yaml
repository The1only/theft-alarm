name: learn_something
description: "A new Flutter project for cross-platform development."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Bluetooth dependencies for real device connection
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  # Audio for alarm sound
  audioplayers: ^6.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/